name: Publish

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
        version:
          description: Release version (adheres to Semantic Versioning)
          required: true
          type: string

concurrency:
  group: packwiz-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
      
      - name: Setup packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Bump pack.toml version
        env:
          pack_version: ${{ inputs.version }}
        run: |
          # pack.toml
          sed -i -E "s/^version = .*/version = \"${pack_version}\"/" 'pack.toml'

          # bcc.json
          jq --arg version "$pack_version" \
            '.modpackVersion = $version' \
            config/bcc.json > config/bcc.json.tmp && mv config/bcc.json.tmp config/bcc.json

      - name: Commit release
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: release ${{ inputs.version }}"
          tag_name: ${{ inputs.version }}
      
      - name: Export modpack
        run: packwiz mr export
      
      - name: Release modpack
        if: github.ref == 'refs/heads/main'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: wN2gCfe8
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: '*.mrpack'
          
          name: Wonderfabric ${{ inputs.version }}
          version: ${{ inputs.version }}

          loaders: fabric
          environment: client | server
          game-versions: 1.20.1
